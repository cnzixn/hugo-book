baseURL: https://b.225228.xyz/
title: 饥荒模组手册
theme: hugo-book

# 站点默认语言：中文（影响 <html lang>、界面文案、搜索索引语言）
defaultContentLanguage: zh
languageCode: zh-cn

copyright: "© 2026 - [Hugo Book Theme](https://github.com/alex-shpak/hugo-book/)"

# Book configuration
# 书籍配置
disablePathToLower: true
enableGitInfo: true

# Needed for mermaid/katex shortcodes
# mermaid/katex 短代码所需配置
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
  highlight:
    style: base16-snazzy

# Multi-lingual mode config
# 多语言模式配置
# There are different options to translate files
# 有多种方式可以翻译文件
# See https://gohugo.io/content-management/multilingual/#translation-by-filename
# 参考：https://gohugo.io/content-management/multilingual/#translation-by-filename
# And https://gohugo.io/content-management/multilingual/#translation-by-content-directory
# 以及：https://gohugo.io/content-management/multilingual/#translation-by-content-directory
# languages:
#   en:
#     languageName: English
#     contentDir: content
#     weight: 1
#   zh:
#     languageName: Chinese
#     contentDir: content.zh
#     weight: 2
#   he:
#     languageName: Hebrew
#     contentDir: content.he
#     languageDirection: rtl
#     weight: 3

menu:
  home:
    # - name: "手册"
    #   pageRef: "/docs/ds-book/"
    #   weight: 10
    #   params:
    #     bookIcon: "bi-journal"
    - name: "文章"
      pageRef: "/posts/"
      weight: 15
      params:
        bookIcon: "bi-book"
    - name: "日志"
      pageRef: "/changelog/"
      weight: 15
      params:
        bookIcon: "bi-hourglass"
    - name: "关于"
      pageRef: "/about/"
      weight: 20
      params:
        bookIcon: "bi-info-square"

  # before: 
  #   - name: "联系我们"
  #     url: "mailto:contact@example.com"
  #     weight: 10
  after:
    - name: "全部文章"
      pageRef: "/posts/"
      weight: 10
      params:
        bookIcon: "bi-book"
    - name: "更新日志"
      pageRef: "/changelog/"
      weight: 10
      params:
        bookIcon: "bi-hourglass"
    - name: "关于本站"
      pageRef: "/about/"
      weight: 99
      params:
        bookIcon: "bi-info-square"





# taxonomies:
#   tag: tags

params:
  # (Optional, default light) Sets color theme: light or dark.
  # （可选，默认 light）设置颜色主题：light 或 dark
  BookTheme: "github-light"

  # (Optional, default none) Controls table of contents visibility on right side of pages.
  # （可选，默认 none）控制页面右侧目录可见性
  # Start and end levels can be controlled with markup.tableOfContents setting.
  # 起始和结束层级可通过 markup.tableOfContents 设置控制
  # You can also specify this parameter per page in front matter.
  # 也可以在每页的 front matter 中单独指定此参数
  # BookToC: true

  # (Optional, default favicon.png) Set the path to a favicon file.
  # （可选，默认 favicon.png）设置网站图标路径
  # If the favicon is /static/favicon.png then the path would be favicon.png
  # 如果图标路径为 /static/favicon.png，则路径写为 favicon.png
  BookFavicon: "favicon.svg"

  # (Optional, default none) Set the path to a logo for the book.
  # （可选，默认 none）设置书籍 logo 路径
  # If the logo is /static/logo.png then the path would be logo.png
  # 如果 logo 路径为 /static/logo.png，则路径写为 logo.png
  # BookLogo: "favicon.svg"

  # (Optional, default docs) Specify root page to render child pages as menu.
  # （可选，默认 docs）指定根页面以将子页面渲染为菜单
  # Page is resoled by .GetPage function: https://gohugo.io/functions/getpage/
  # 页面可通过 .GetPage 函数解析：https://gohugo.io/functions/getpage/
  # For backward compatibility you can set '*' to render all sections to menu. Acts same as '/'
  # 为向后兼容，可设置 '*' 将所有 section 渲染为菜单，等同于 '/'
  BookSection: "docs"

  # (Optional, default none) Set template for commit link for the page. Requires enableGitInfo.
  # （可选，默认 none）设置页面提交链接模板，需启用 enableGitInfo
  # When set enabled 'Last Modified' and a link to the commit in the footer of the page.
  # 设置后页脚显示"最后修改"及提交链接
  # Param is executed as template using .Site, .Page and .GitInfo as context.
  # 参数以 .Site、.Page 和 .GitInfo 为上下文作为模板执行
  # BookLastChangeLink: 'https://github.com/cnzixn/hugo-book/commit/{{ .GitInfo.Hash }}'

  # (Optional, default none) Set template for edit page link.
  # （可选，默认 none）设置编辑页面链接模板
  # When set enabled 'Edit this page' link in the footer of the page.
  # 设置后页脚显示"编辑本页"链接
  # Param is executed as template using .Site, .Page and .Path as context.
  # 参数以 .Site、.Page 和 .Path 为上下文作为模板执行
  # BookEditLink: 'https://github.com/cnzixn/hugo-book/edit/main/{{ .Path }}'

  # (Optional, default 'January 2, 2006') Configure the date format used on the pages
  # （可选，默认 'January 2, 2006'）配置页面使用的日期格式
  # - In git information
  # - 用于 git 信息
  # - In blog posts
  # - 用于博客文章
  # https://gohugo.io/functions/time/format/
  # 参考：https://gohugo.io/functions/time/format/
  BookDateFormat: "2006-01-02"

  # (Optional, default true) Enables search function with flexsearch,
  # （可选，默认 true）启用基于 flexsearch 的搜索功能
  # Index is built on fly, therefore it might slowdown your website.
  # 索引在运行时构建，可能会降低网站速度
  # Configuration for indexing can be adjusted in i18n folder per language.
  # 索引配置可在 i18n 文件夹中按语言调整
  BookSearch: true

  # (Optional, default true) 全局 PV 统计总开关
  # 设为 false 时整站关闭浏览/访客统计（页脚不再渲染统计内容与脚本）
  # 置为 true 或删除本行即恢复统计
  BookPV: false

  # (Optional, default true) Enables comments template on pages
  # （可选，默认 true）启用页面评论模板
  # By default partals/docs/comments.html includes Disqus template
  # 默认 partials/docs/comments.html 包含 Disqus 模板
  # See https://gohugo.io/content-management/comments/#configure-disqus
  # 参考：https://gohugo.io/content-management/comments/#configure-disqus
  # Can be overwritten by same param in page frontmatter
  # 可在页面 frontmatter 中通过相同参数覆盖
  BookComments: false

  # /!\ This is an experimental feature, might be removed or changed at any time
  # /!\ 这是实验性功能，随时可能被移除或修改
  # (Optional, experimental, default false) Enables portable links and link checks in markdown pages.
  # （可选，实验性，默认 false）在 markdown 页面启用便携链接和链接检查
  # Portable links meant to work with text editors and let you write markdown without {{< relref >}} shortcode
  # 便携链接旨在与文本编辑器配合，让你无需 {{< relref >}} 短代码即可编写 markdown
  # Theme will print warning or error if page referenced in markdown does not exists.
  # 如果 markdown 中引用的页面不存在，主题将打印警告或错误
  # Possible values are false | 'warning' | 'error'
  # 可选值：false | 'warning' | 'error'
  BookPortableLinks: 'warning'

  # /!\ This is an experimental feature, might be removed or changed at any time
  # /!\ 这是实验性功能，随时可能被移除或修改
  # (Optional, experimental, default false) Enables service worker that caches visited pages and resources for offline use.
  # （可选，实验性，默认 false）启用服务 worker，缓存访问过的页面和资源以供离线使用
  # can be false, true or 'precache', precache will try to download all content pages on install.
  # 可选值：false、true 或 'precache'，precache 将在安装时尝试下载所有内容页面
  BookServiceWorker: false

  # /!\ This is an experimental feature, might be removed or changed at any time
  # /!\ 这是实验性功能，随时可能被移除或修改
  # (Optional, experimental, default false) Enables a drop-down menu for translations only if a translation is present.
  # （可选，实验性，默认 false）仅当存在译文时启用翻译下拉菜单
  BookTranslatedOnly: false
