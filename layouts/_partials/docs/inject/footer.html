<div class="book-copyright flex justify-center">
  <small>统计数据：浏览 <span data-pv>--</span> / <span data-pv="site">--</span> 次，访客 <span data-uv="site">--</span> 人</small>
</div>

{{ if hugo.IsProduction }}
<script>
  // pv-tracker 加载兜底：超时 5 秒后放弃，避免卡住页面 load 事件
  (function() {
    var s = document.createElement('script');
    s.src = 'https://pv.bxq.me/js/pv-tracker.min.js';
    s.defer = true;
    s.async = true;
    var done = false;
    s.onload = s.onreadystatechange = function() {
      if (!done && (!this.readyState || this.readyState === 'loaded' || this.readyState === 'complete')) {
        done = true;
      }
    };
    var t = setTimeout(function() {
      if (!done) {
        // 超时未加载完成，移除脚本避免阻塞
        var nodes = document.querySelectorAll('script[src*="pv.bxq.me"]');
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i].parentNode) nodes[i].parentNode.removeChild(nodes[i]);
        }
        // 兜底：把统计的 -- 去掉提示
        var spans = document.querySelectorAll('span[data-pv], span[data-uv]');
        for (var i = 0; i < spans.length; i++) {
          spans[i].textContent = '-';
        }
      }
    }, 5000);
    s.onerror = function() {
      done = true;
      clearTimeout(t);
      var spans = document.querySelectorAll('span[data-pv], span[data-uv]');
      for (var i = 0; i < spans.length; i++) {
        spans[i].textContent = '-';
      }
    };
    document.body.appendChild(s);
  })();
</script>
{{ end }}
